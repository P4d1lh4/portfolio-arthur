<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Arthur Padilha — Desenvolvedor Full-Stack</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — MIT License
      // https://github.com/rafgraph/spa-github-pages
      // Redireciona qualquer rota (ex. /portfolio-arthur/sobre) para o index
      // preservando o caminho na query string, decodificado pelo index.html.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
